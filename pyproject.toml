[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbox"
version = "0.1.0"
description = "Docker-like Google Colab GPU Runtime Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CBox Developers" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cbox = "cbox.cli.main:cli_app"
cboxd = "cbox.daemon.main:daemon_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
